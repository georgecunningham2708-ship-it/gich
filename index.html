<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED VS GLITCH S1 E2</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0a0015, #2b0040, #000000);
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: red;
}

/* Dark overlay */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* Title */
.title {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 5px;
    text-align: center;
}

/* Timer */
.timer {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    letter-spacing: 3px;
}
</style>

</head>
<body>

<div class="overlay"></div>

<div class="title">RED VS GLITCH S1 E2</div>
<div class="timer" id="countdown">48:00:00</div>

<!-- Wind sound -->

<audio id="wind" autoplay loop>
    <source src="dragon-studio-heavy-blizzard-wind-gust-515271 (1).mp3" type="audio/mpeg">
</audio>

<script>
// Check if a saved end time exists
let endTime = localStorage.getItem("endTime");

if (!endTime) {
    // Set new 48 hour timer
    endTime = new Date().getTime() + (48 * 60 * 60 * 1000);
    localStorage.setItem("endTime", endTime);
}

const countdownEl = document.getElementById("countdown");

function updateTimer() {
    let now = new Date().getTime();
    let distance = endTime - now;

    if (distance < 0) {
        countdownEl.textContent = "00:00:00";
        return;
    }

    let hours = Math.floor(distance / (1000 * 60 * 60));
    let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    let seconds = Math.floor((distance % (1000 * 60)) / 1000);

    countdownEl.textContent =
        String(hours).padStart(2, '0') + ":" +
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0');
}

setInterval(updateTimer, 1000);

// Fix autoplay (user interaction fallback)
document.body.addEventListener("click", () => {
    document.getElementById("wind").play();
});
</script>

</body>
</html>
