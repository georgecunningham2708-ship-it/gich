<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED VS GLITCH S1 E2</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: url("your-image.png") no-repeat center center/cover;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Dark overlay */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
}

/* Cinematic text */
.title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: red;
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 4px;
    text-align: center;
    text-transform: uppercase;
    animation: flicker 2s infinite;
}

/* Glitch layers */
.title::before,
.title::after {
    content: "RED VS GLITCH S1 E2";
    position: absolute;
    left: 0;
    width: 100%;
}

.title::before {
    color: #ff0000;
    animation: glitchTop 1s infinite;
}

.title::after {
    color: #990000;
    animation: glitchBottom 1s infinite;
}

/* Animations */
@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

@keyframes glitchTop {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, -2px); }
    40% { transform: translate(2px, 2px); }
    60% { transform: translate(-1px, 1px); }
    80% { transform: translate(1px, -1px); }
    100% { transform: translate(0); }
}

@keyframes glitchBottom {
    0% { transform: translate(0); }
    20% { transform: translate(2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(1px, -1px); }
    80% { transform: translate(-1px, 1px); }
    100% { transform: translate(0); }
}
</style>

</head>
<body>

<div class="overlay"></div>

<div class="title">RED VS GLITCH S1 E2</div>

</body>
</html>
